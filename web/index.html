<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>wealth · BTC up/down — live</title>
<style>
  :root {
    --surface: #fcfcfb; --page: #f9f9f7;
    --ink-1: #0b0b0b; --ink-2: #52514e; --ink-3: #898781;
    --grid: #e1e0d9; --baseline: #c3c2b7; --border: rgba(11,11,11,.10);
    --hover: rgba(11,11,11,.035);
    --series: #2a78d6; --good: #006300; --bad: #d03b3b;
    --good-soft: rgba(12,163,12,.12); --bad-soft: rgba(208,59,59,.12);
    --shadow: 0 1px 2px rgba(11,11,11,.04), 0 4px 16px rgba(11,11,11,.04);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --surface: #1a1a19; --page: #0d0d0d;
      --ink-1: #ffffff; --ink-2: #c3c2b7; --ink-3: #898781;
      --grid: #2c2c2a; --baseline: #383835; --border: rgba(255,255,255,.10);
      --hover: rgba(255,255,255,.045);
      --series: #3987e5; --good: #0ca30c; --bad: #e66767;
      --good-soft: rgba(12,163,12,.16); --bad-soft: rgba(230,103,103,.16);
      --shadow: 0 1px 2px rgba(0,0,0,.3), 0 6px 20px rgba(0,0,0,.25);
    }
  }
  * { box-sizing: border-box; margin: 0; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    background: var(--page); color: var(--ink-1);
    font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif;
    padding: 0 16px 24px;
  }
  .num { font-variant-numeric: tabular-nums; }

  /* ---------- header ---------- */
  .topbar {
    max-width: 1080px; margin: 0 auto; padding: 14px 2px 12px;
    display: flex; align-items: center; gap: 10px;
  }
  .logo { display: flex; align-items: center; gap: 9px; }
  .logo svg { display: block; }
  .logo .name { font-size: 15px; font-weight: 700; letter-spacing: -0.01em; white-space: nowrap; }
  .logo .name span { color: var(--ink-3); font-weight: 500; }
  .top-right { margin-left: auto; display: flex; align-items: center; gap: 10px; }
  .pill {
    font-size: 10.5px; font-weight: 700; letter-spacing: .08em;
    padding: 3.5px 9px; border-radius: 999px;
    border: 1px solid var(--border); color: var(--ink-2); background: var(--surface);
  }
  .pill.live { color: #fff; background: var(--bad); border-color: transparent; }
  .conn { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--ink-3); white-space: nowrap; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--ink-3); }
  .dot.fresh { background: var(--good); animation: pulse 2.4s ease-out infinite; }
  @keyframes pulse {
    0% { box-shadow: 0 0 0 0 var(--good-soft); }
    70% { box-shadow: 0 0 0 7px transparent; }
    100% { box-shadow: 0 0 0 0 transparent; }
  }

  /* ---------- stale banner ---------- */
  .stalebar {
    max-width: 1080px; margin: 0 auto 12px; padding: 8px 14px;
    border-radius: 10px; font-size: 12.5px; display: none;
    background: var(--bad-soft); color: var(--ink-1);
    border: 1px solid var(--border);
  }
  .stalebar.show { display: block; }

  /* ---------- layout ---------- */
  main { max-width: 1080px; margin: 0 auto; display: grid; gap: 12px; }
  .card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 14px; padding: 16px; box-shadow: var(--shadow);
    min-width: 0;
  }
  .kpis { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
  .row-main { display: grid; grid-template-columns: 2fr 1fr; gap: 12px; align-items: start; }
  .row-main .side { display: grid; gap: 12px; }
  .row-tables { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; align-items: start; }
  @media (max-width: 840px) {
    .kpis { grid-template-columns: 1fr 1fr; }
    .row-main, .row-tables { grid-template-columns: 1fr; }
  }

  /* ---------- kpi cards ---------- */
  .kpi .overline, .card .overline {
    font-size: 10.5px; font-weight: 600; letter-spacing: .09em;
    text-transform: uppercase; color: var(--ink-3); margin-bottom: 6px;
  }
  .kpi .big { font-size: 25px; font-weight: 700; letter-spacing: -0.01em; line-height: 1.15; }
  .kpi .big.pos { color: var(--good); } .kpi .big.neg { color: var(--bad); }
  .kpi .sub { font-size: 12px; color: var(--ink-3); margin-top: 5px; display: flex; align-items: center; gap: 7px; }
  .wl-bar { display: inline-flex; height: 5px; border-radius: 3px; overflow: hidden; width: 64px; }
  .wl-bar i { display: block; height: 100%; }
  .wl-bar .w { background: var(--good); }
  .wl-bar .l { background: var(--bad); margin-left: 2px; }

  /* ---------- chart cards ---------- */
  .card-head { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
  .card-head .overline { margin-bottom: 0; }
  .seg { margin-left: auto; display: inline-flex; background: var(--page);
         border: 1px solid var(--border); border-radius: 8px; padding: 2px; }
  .seg button {
    border: none; background: none; color: var(--ink-3); cursor: pointer;
    font: 600 11.5px/1 system-ui, sans-serif; padding: 5px 9px; border-radius: 6px;
  }
  .seg button.on { background: var(--surface); color: var(--ink-1);
                   box-shadow: 0 1px 2px rgba(0,0,0,.12); }
  .chart-wrap { position: relative; }
  .chart-wrap svg { display: block; width: 100%; height: auto; }
  .tooltip {
    position: fixed; pointer-events: none; display: none; z-index: 10;
    background: var(--surface); border: 1px solid var(--border); border-radius: 9px;
    padding: 7px 10px; font-size: 12px; color: var(--ink-2); white-space: nowrap;
    box-shadow: var(--shadow);
  }
  .tooltip b { color: var(--ink-1); font-variant-numeric: tabular-nums; font-size: 13px; }
  .tooltip .d-pos { color: var(--good); } .tooltip .d-neg { color: var(--bad); }

  /* ---------- right now ---------- */
  .spot { font-size: 25px; font-weight: 700; letter-spacing: -0.01em; }
  .spot small { font-size: 12px; font-weight: 500; color: var(--ink-3); margin-left: 5px; }
  .prob { margin-top: 12px; }
  .prob .lab { font-size: 11.5px; color: var(--ink-2); display: flex; justify-content: space-between; margin-bottom: 4px; }
  .prob .lab b { font-variant-numeric: tabular-nums; }
  .prob .track { height: 6px; border-radius: 3px; background: var(--grid); overflow: hidden; }
  .prob .fill { height: 100%; background: var(--series); border-radius: 3px; }

  /* ---------- chips ---------- */
  .chips { display: flex; flex-wrap: wrap; gap: 7px; }
  .chip {
    font-size: 11.5px; padding: 4px 10px; border-radius: 999px;
    background: var(--page); border: 1px solid var(--border); color: var(--ink-2);
  }
  .chip b { color: var(--ink-1); font-variant-numeric: tabular-nums; }

  /* ---------- tables ---------- */
  table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
  th {
    text-align: left; color: var(--ink-3); font-weight: 600; font-size: 10.5px;
    text-transform: uppercase; letter-spacing: .07em;
    border-bottom: 1px solid var(--grid); padding: 5px 7px;
  }
  td { padding: 7px; border-bottom: 1px solid var(--grid); font-variant-numeric: tabular-nums; }
  td.when { white-space: nowrap; }
  td.slug { overflow-wrap: anywhere; }
  tbody tr:hover td { background: var(--hover); }
  tr:last-child td { border-bottom: none; }
  td.r, th.r { text-align: right; }
  .pnl-pos { color: var(--good); font-weight: 600; } .pnl-neg { color: var(--bad); font-weight: 600; }
  .outcome {
    font-size: 10.5px; font-weight: 700; letter-spacing: .04em;
    padding: 2.5px 8px; border-radius: 999px; white-space: nowrap;
  }
  .outcome.up { background: var(--good-soft); color: var(--good); }
  .outcome.down { background: var(--bad-soft); color: var(--bad); }
  .muted { color: var(--ink-3); }
  .showall {
    margin-top: 8px; width: 100%; border: 1px dashed var(--border); background: none;
    color: var(--ink-3); font: 500 12px system-ui, sans-serif; padding: 7px;
    border-radius: 8px; cursor: pointer;
  }
  .showall:hover { color: var(--ink-1); background: var(--hover); }
  .empty { color: var(--ink-3); font-size: 13px; padding: 10px 0 4px; }

  /* ---------- states ---------- */
  .skeleton { border-radius: 8px; background:
    linear-gradient(100deg, var(--grid) 40%, var(--page) 50%, var(--grid) 60%);
    background-size: 200% 100%; animation: shimmer 1.4s infinite; }
  @keyframes shimmer { to { background-position: -200% 0; } }
  .center-card { max-width: 460px; margin: 8vh auto 0; text-align: center; padding: 30px 24px; }
  .center-card h2 { font-size: 18px; margin-bottom: 8px; }
  .center-card p { font-size: 13px; color: var(--ink-3); margin-bottom: 14px; }
  .center-card input {
    width: 100%; padding: 10px 13px; font: inherit; margin-bottom: 12px;
    border: 1px solid var(--border); border-radius: 9px;
    background: var(--page); color: var(--ink-1);
  }
  .btn {
    padding: 10px 22px; font: 600 13.5px system-ui, sans-serif; border: none;
    border-radius: 9px; background: var(--series); color: #fff; cursor: pointer;
  }
  .btn:hover { filter: brightness(1.08); }
  footer {
    max-width: 1080px; margin: 18px auto 0; text-align: center;
    font-size: 11px; color: var(--ink-3);
  }
</style>
</head>
<body>

<div class="topbar">
  <div class="logo">
    <svg width="26" height="26" viewBox="0 0 26 26" aria-hidden="true">
      <rect x="1" y="1" width="24" height="24" rx="7" fill="var(--series)"/>
      <path d="M6 16.5 L10.2 10.5 L13.4 13.8 L19.5 6.8" fill="none" stroke="#fff"
            stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="19.5" cy="6.8" r="1.9" fill="#fff"/>
    </svg>
    <div class="name">wealth <span>· BTC up/down</span></div>
  </div>
  <div class="top-right" id="topright"></div>
</div>
<div class="stalebar" id="stalebar">
  ⚠ Feed is stale — the bot hasn't published for a while. Check that
  <code>wealth polymarket run</code> is running on your PC.
</div>
<main id="app"></main>
<footer id="foot"></footer>
<div class="tooltip" id="tip"></div>

<script>
"use strict";
const $ = id => document.getElementById(id);
const FILE = "wealth-live.json";
const state = { snap: null, range: "all", showAllRes: false, error: null };

const esc = s => String(s ?? "").replace(/[&<>"]/g,
  c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const money = (v, dp = 2) => v === null || v === undefined ? "—"
  : "$" + Number(v).toLocaleString("en-US", { minimumFractionDigits: dp, maximumFractionDigits: dp });
const signed = v => (v >= 0 ? "+" : "−") + money(Math.abs(v));
const rel = iso => {
  if (!iso) return "";
  const s = (Date.now() - new Date(iso).getTime()) / 1000;
  if (s < 50) return Math.max(0, Math.round(s)) + "s ago";
  if (s < 3600) return Math.round(s / 60) + "m ago";
  if (s < 86400) return (s / 3600).toFixed(1).replace(/\.0$/, "") + "h ago";
  return Math.round(s / 86400) + "d ago";
};
const hm = iso => (iso || "").slice(11, 16);
const dhm = iso => (iso || "").slice(5, 16).replace("T", " ");
// compact market label for tables: "btc-updown-15m-1783253438" -> "15m · …3438"
const shortSlug = slug => {
  const m = /^btc-updown-(\w+)-(\d{6,})$/.exec(slug || "");
  if (m) return `${m[1]} · …${m[2].slice(-4)}`;
  return String(slug || "").replace(/^bitcoin-up-or-down-/, "");
};

function gistId() {
  const q = new URLSearchParams(location.search).get("gist");
  if (q) { localStorage.setItem("wealth_gist", q); return q; }
  return localStorage.getItem("wealth_gist");
}

async function fetchSnapshot(id) {
  try {  // GitHub API: uncached; anonymous limit 60/h/IP is fine at 1/min
    const r = await fetch(`https://api.github.com/gists/${id}`,
      { headers: { Accept: "application/vnd.github+json" } });
    if (r.ok) {
      const g = await r.json();
      const f = g.files && g.files[FILE];
      if (f) {
        if (!f.truncated && f.content) return JSON.parse(f.content);
        const raw = await fetch(f.raw_url);
        if (raw.ok) return await raw.json();
      }
    }
  } catch (e) { /* fall back to raw below */ }
  const raw = await fetch(`https://gist.githubusercontent.com/raw/${id}/${FILE}`);
  if (!raw.ok) throw new Error(`fetch failed (${raw.status})`);
  return await raw.json();
}

/* ---------------------------------------------------------------- header */
function renderHeader() {
  const s = state.snap;
  const ageMin = s && s.updated_at ? (Date.now() - new Date(s.updated_at).getTime()) / 60000 : null;
  const fresh = ageMin !== null && ageMin <= 3;
  $("topright").innerHTML = s ? `
    <span class="conn"><span class="dot ${fresh ? "fresh" : ""}"></span>
      ${s.updated_at ? "updated " + rel(s.updated_at) : "no data"}</span>
    <span class="pill ${s.mode === "live" ? "live" : ""}">${s.mode === "live" ? "LIVE" : "PAPER"}</span>` : "";
  $("stalebar").classList.toggle("show", !!s && !fresh);
}
setInterval(renderHeader, 1000);

/* ---------------------------------------------------------------- charts */
const CW = 720, CH = 250, PL = 56, PR = 12, PT = 14, PB = 26;

function rangePoints(points) {
  if (!points || !points.length) return [];
  if (state.range === "all") return points;
  const hours = { "1h": 1, "6h": 6, "24h": 24 }[state.range];
  const last = new Date(points[points.length - 1][0]).getTime();
  const cut = last - hours * 3600_000;
  const out = points.filter(p => new Date(p[0]).getTime() >= cut);
  return out.length >= 2 ? out : points.slice(-2);
}

function equityChart(points) {
  if (!points || points.length < 2)
    return `<div class="empty">Not enough data yet — the chart appears after a few ticks.</div>`;
  const vals = points.map(p => p[1]);
  let lo = Math.min(...vals), hi = Math.max(...vals);
  if (hi - lo < 1e-9) { hi += 1; lo -= 1; }
  const pad = (hi - lo) * .1; lo -= pad; hi += pad;
  const x = i => PL + (i / (points.length - 1)) * (CW - PL - PR);
  const y = v => PT + (1 - (v - lo) / (hi - lo)) * (CH - PT - PB);
  const start = points[0][1];

  let grid = "", ylab = "";
  for (let g = 0; g < 4; g++) {
    const v = lo + ((g + .5) / 4) * (hi - lo), gy = y(v);
    grid += `<line x1="${PL}" y1="${gy}" x2="${CW - PR}" y2="${gy}" stroke="var(--grid)"/>`;
    ylab += `<text x="${PL - 7}" y="${gy + 3.5}" text-anchor="end" font-size="10.5"
             fill="var(--ink-3)" class="num">${v.toLocaleString("en-US", {maximumFractionDigits: 0})}</text>`;
  }
  const span = new Date(points[points.length - 1][0]) - new Date(points[0][0]);
  const fmt = span > 20 * 3600_000 ? dhm : hm;
  let xlab = "";
  for (const f of [0, .5, 1]) {
    const i = Math.round(f * (points.length - 1));
    xlab += `<text x="${x(i)}" y="${CH - 8}" font-size="10.5" fill="var(--ink-3)"
             text-anchor="${f === 0 ? "start" : f === 1 ? "end" : "middle"}">${esc(fmt(points[i][0]))}</text>`;
  }
  const line = points.map((p, i) => `${i ? "L" : "M"}${x(i).toFixed(1)},${y(p[1]).toFixed(1)}`).join("");
  const area = `${line}L${x(points.length - 1).toFixed(1)},${CH - PB}L${PL},${CH - PB}Z`;
  return `
  <div class="chart-wrap" id="eqwrap">
    <svg viewBox="0 0 ${CW} ${CH}" id="eqchart" aria-label="Equity over time">
      <defs><linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="var(--series)" stop-opacity=".22"/>
        <stop offset="1" stop-color="var(--series)" stop-opacity=".02"/>
      </linearGradient></defs>
      ${grid}${ylab}
      <line x1="${PL}" y1="${y(start)}" x2="${CW - PR}" y2="${y(start)}"
            stroke="var(--baseline)" stroke-dasharray="3 4"/>
      <path d="${area}" fill="url(#fade)"/>
      <path d="${line}" fill="none" stroke="var(--series)" stroke-width="2"
            stroke-linejoin="round" stroke-linecap="round"/>
      <line x1="${PL}" y1="${CH - PB}" x2="${CW - PR}" y2="${CH - PB}" stroke="var(--baseline)"/>
      ${xlab}
      <line id="xhair" y1="${PT}" y2="${CH - PB}" stroke="var(--baseline)" style="display:none"/>
      <circle id="hdot" r="4" fill="var(--series)" stroke="var(--surface)" stroke-width="2"
              style="display:none"/>
    </svg>
  </div>`;
}

function wireEquityHover(points) {
  const svg = $("eqchart");
  if (!svg || points.length < 2) return;
  const vals = points.map(p => p[1]);
  let lo = Math.min(...vals), hi = Math.max(...vals);
  if (hi - lo < 1e-9) { hi += 1; lo -= 1; }
  const pad = (hi - lo) * .1; lo -= pad; hi += pad;
  const y = v => PT + (1 - (v - lo) / (hi - lo)) * (CH - PT - PB);
  const start = points[0][1];
  const move = ev => {
    const rect = svg.getBoundingClientRect();
    const cx = ((ev.touches ? ev.touches[0].clientX : ev.clientX) - rect.left) * (CW / rect.width);
    const frac = Math.min(1, Math.max(0, (cx - PL) / (CW - PL - PR)));
    const i = Math.round(frac * (points.length - 1));
    const px = PL + (i / (points.length - 1)) * (CW - PL - PR), py = y(points[i][1]);
    const xh = $("xhair"), dt = $("hdot");
    xh.setAttribute("x1", px); xh.setAttribute("x2", px); xh.style.display = "";
    dt.setAttribute("cx", px); dt.setAttribute("cy", py); dt.style.display = "";
    const d = points[i][1] - start;
    showTip(ev, `${esc(dhm(points[i][0]))}<br><b>${money(points[i][1])}</b>
      <span class="${d >= 0 ? "d-pos" : "d-neg"}">${signed(d)}</span>`);
  };
  const leave = () => { $("xhair").style.display = "none"; $("hdot").style.display = "none"; hideTip(); };
  svg.addEventListener("mousemove", move);
  svg.addEventListener("touchmove", move, { passive: true });
  svg.addEventListener("mouseleave", leave);
  svg.addEventListener("touchend", leave);
}

function pnlChart(resolutions) {
  const rows = (resolutions || []).filter(r => Number(r.pnl) !== 0).slice(-40);
  if (!rows.length) return "";
  const H = 190, PT2 = 12, PB2 = 20, PL2 = 46, PR2 = 10;
  const vals = rows.map(r => Number(r.pnl));
  const hi = Math.max(0, ...vals), lo = Math.min(0, ...vals);
  const y = v => PT2 + (1 - (v - lo) / (hi - lo || 1)) * (H - PT2 - PB2);
  const y0 = y(0);
  const plot = CW - PL2 - PR2;
  const gap = 2, bw = Math.min(26, plot / rows.length - gap);
  let bars = "";
  rows.forEach((r, i) => {
    const v = Number(r.pnl);
    const bx = PL2 + i * (plot / rows.length) + (plot / rows.length - bw) / 2;
    const top = v >= 0 ? y(v) : y0, bot = v >= 0 ? y0 : y(v);
    const h = Math.max(2, bot - top), rr = Math.min(3.5, bw / 2, h);
    // rounded at the value end, square at the zero baseline
    const d = v >= 0
      ? `M${bx},${bot} V${top + rr} Q${bx},${top} ${bx + rr},${top} H${bx + bw - rr}
         Q${bx + bw},${top} ${bx + bw},${top + rr} V${bot} Z`
      : `M${bx},${top} V${bot - rr} Q${bx},${bot} ${bx + rr},${bot} H${bx + bw - rr}
         Q${bx + bw},${bot} ${bx + bw},${bot - rr} V${top} Z`;
    bars += `<path d="${d}" fill="var(${v >= 0 ? "--good" : "--bad"})" opacity=".85"
             data-i="${i}"/>`;
  });
  let ylab = "";
  for (const v of [hi, 0, lo]) {
    if (v === undefined) continue;
    ylab += `<text x="${PL2 - 7}" y="${y(v) + 3.5}" text-anchor="end" font-size="10.5"
             fill="var(--ink-3)" class="num">${v.toFixed(0)}</text>`;
  }
  return `
  <div class="card-head"><div class="overline">PnL per market</div></div>
  <div class="chart-wrap">
    <svg viewBox="0 0 ${CW} ${H}" id="pnlchart" aria-label="PnL per resolved market">
      <line x1="${PL2}" y1="${y0}" x2="${CW - PR2}" y2="${y0}" stroke="var(--baseline)"/>
      ${ylab}${bars}
    </svg>
  </div>`;
}

function wirePnlHover(resolutions) {
  const svg = $("pnlchart");
  if (!svg) return;
  const rows = (resolutions || []).filter(r => Number(r.pnl) !== 0).slice(-40);
  svg.querySelectorAll("path[data-i]").forEach(el => {
    const r = rows[Number(el.dataset.i)];
    el.addEventListener("mousemove", ev => showTip(ev,
      `${esc(r.slug)}<br>${r.outcome === "up" ? "▲ up" : "▼ down"} ·
       <b class="${Number(r.pnl) >= 0 ? "d-pos" : "d-neg"}">${signed(Number(r.pnl))}</b>`));
    el.addEventListener("mouseleave", hideTip);
  });
}

const tip = () => $("tip");
function showTip(ev, html) {
  const t = tip();
  t.innerHTML = html; t.style.display = "block";
  const x = (ev.touches ? ev.touches[0].clientX : ev.clientX);
  const y = (ev.touches ? ev.touches[0].clientY : ev.clientY);
  const w = t.offsetWidth, ww = window.innerWidth;
  t.style.left = Math.min(x + 14, ww - w - 8) + "px";
  t.style.top = (y - t.offsetHeight - 12) + "px";
}
function hideTip() { tip().style.display = "none"; }

/* ---------------------------------------------------------------- pieces */
function kpiCard(label, value, tone, sub) {
  const cls = tone === undefined || tone === null ? "" : tone >= 0 ? " pos" : " neg";
  return `<div class="card kpi"><div class="overline">${esc(label)}</div>
    <div class="big num${cls}">${value}</div>
    ${sub ? `<div class="sub">${sub}</div>` : ""}</div>`;
}

function todayStats(resolutions) {
  const today = new Date().toISOString().slice(0, 10);
  let pnl = 0, n = 0;
  for (const r of resolutions || []) {
    if ((r.timestamp || "").slice(0, 10) === today) { pnl += Number(r.pnl); n += 1; }
  }
  return { pnl, n };
}

function render() {
  const s = state.snap;
  const k = s.kpis || {};
  const t = todayStats(s.resolutions);
  const winPct = k.win_rate === null || k.win_rate === undefined ? null : k.win_rate;
  const wl = (k.wins ?? 0) + (k.losses ?? 0);
  const points = rangePoints(s.equity_curve);
  const resolutions = (s.resolutions || []).slice().reverse();
  const resShown = state.showAllRes ? resolutions : resolutions.slice(0, 12);

  const positions = (s.positions || []).map(p => {
    const side = /:(UP|DOWN)$/.exec(p.symbol || "");
    const base = (p.symbol || "").replace(/:(UP|DOWN)$/, "");
    return `
    <tr><td class="slug" title="${esc(p.symbol)}">${esc(shortSlug(base))}${side
      ? ` <span class="outcome ${side[1].toLowerCase()}">${side[1] === "UP" ? "▲ UP" : "▼ DOWN"}</span>` : ""}</td>
    <td class="r">${Number(p.size).toLocaleString()}</td>
    <td class="r">${Number(p.avg_price).toFixed(3)}</td>
    <td class="r">${money(p.size * p.avg_price)}</td></tr>`;
  }).join("");

  const resRows = resShown.map(r => {
    const pnl = Number(r.pnl);
    return `<tr>
      <td class="muted when" title="${esc(r.timestamp)}">${esc(rel(r.timestamp))}</td>
      <td class="slug" title="${esc(r.slug)}">${esc(shortSlug(r.slug))}</td>
      <td><span class="outcome ${r.outcome === "up" ? "up" : "down"}">
          ${r.outcome === "up" ? "▲ UP" : "▼ DOWN"}</span></td>
      <td class="r ${pnl > 0 ? "pnl-pos" : pnl < 0 ? "pnl-neg" : "muted"}">
          ${pnl === 0 ? "·" : signed(pnl)}</td></tr>`;
  }).join("");

  const probBars = Object.entries(s.fair || {}).map(([slug, p]) => `
    <div class="prob"><div class="lab"><span>${esc(slug)}</span>
      <span>P(up) <b>${Number(p).toFixed(2)}</b></span></div>
      <div class="track"><div class="fill" style="width:${(Number(p) * 100).toFixed(0)}%"></div></div>
    </div>`).join("");

  const chips = Object.entries(s.risk_blocks || {}).sort((a, b) => b[1] - a[1])
    .map(([r, n]) => `<span class="chip">${esc(r)} <b>×${n}</b></span>`).join("");

  const pnlSvg = pnlChart(s.resolutions);

  $("app").innerHTML = `
  <div class="kpis">
    ${kpiCard("Equity", money(k.equity), null,
      t.n ? `<span class="num ${t.pnl >= 0 ? "pnl-pos" : "pnl-neg"}">${signed(t.pnl)}</span> today` : "")}
    ${kpiCard("Realized PnL", signed(k.realized_pnl ?? 0), k.realized_pnl,
      `<span class="num">${k.trades ?? 0}</span> trades`)}
    ${kpiCard("Win rate", winPct === null ? "—" : Math.round(winPct * 100) + "%", null,
      wl ? `<span class="wl-bar" aria-hidden="true">
              <i class="w" style="width:${(k.wins / wl * 100).toFixed(0)}%"></i>
              <i class="l" style="flex:1"></i></span>
            <span class="num">${k.wins}W–${k.losses}L</span>` : "no results yet")}
    ${kpiCard("Resolved today", t.n, null, `<span class="num">${k.resolved ?? 0}</span> all-time`)}
  </div>

  <div class="row-main">
    <div class="card">
      <div class="card-head">
        <div class="overline">Equity</div>
        <div class="seg" id="seg">
          ${["1h", "6h", "24h", "all"].map(r =>
            `<button data-r="${r}" class="${state.range === r ? "on" : ""}">${r.toUpperCase()}</button>`).join("")}
        </div>
      </div>
      ${equityChart(points)}
    </div>
    <div class="side">
      <div class="card">
        <div class="overline">Right now</div>
        ${s.spot ? `<div class="spot num">${Number(s.spot).toLocaleString()}<small>BTC/USDT</small></div>` :
          `<div class="empty">Waiting for the first tick…</div>`}
        ${probBars}
      </div>
      ${chips ? `<div class="card"><div class="overline">Risk blocks</div>
        <div class="chips">${chips}</div></div>` : ""}
    </div>
  </div>

  ${pnlSvg ? `<div class="card">${pnlSvg}</div>` : ""}

  <div class="row-tables">
    <div class="card">
      <div class="overline">Open positions</div>
      ${positions ? `<table><thead><tr><th>Market</th><th class="r">Shares</th>
        <th class="r">Avg</th><th class="r">Cost</th></tr></thead>
        <tbody>${positions}</tbody></table>`
        : `<div class="empty">Flat — no open positions.</div>`}
    </div>
    <div class="card">
      <div class="overline">Resolutions</div>
      ${resRows ? `<table><thead><tr><th>When</th><th>Market</th><th>Outcome</th>
        <th class="r">PnL</th></tr></thead><tbody>${resRows}</tbody></table>`
        : `<div class="empty">No markets resolved yet.</div>`}
      ${resolutions.length > 12 && !state.showAllRes
        ? `<button class="showall" id="showall">Show all ${resolutions.length}</button>` : ""}
    </div>
  </div>`;

  $("foot").textContent =
    `read-only snapshot · refreshes every 60s · feed ${String(gistId() || "").slice(0, 8)}…` +
    (s.started_at ? ` · tracking since ${dhm(s.started_at)}` : "");

  wireEquityHover(points);
  wirePnlHover(s.resolutions);
  const seg = $("seg");
  if (seg) seg.querySelectorAll("button").forEach(b =>
    b.addEventListener("click", () => { state.range = b.dataset.r; render(); }));
  const sa = $("showall");
  if (sa) sa.addEventListener("click", () => { state.showAllRes = true; render(); });
  renderHeader();
}

/* ---------------------------------------------------------------- states */
function renderSkeleton() {
  $("app").innerHTML = `
  <div class="kpis">${'<div class="card kpi"><div class="skeleton" style="height:14px;width:60%"></div><div class="skeleton" style="height:28px;margin-top:10px"></div></div>'.repeat(4)}</div>
  <div class="card"><div class="skeleton" style="height:240px"></div></div>`;
}

function renderSetup(msg) {
  $("app").innerHTML = `
  <div class="card center-card">
    <h2>Connect your feed</h2>
    <p>${esc(msg || "Paste the gist id printed by the bot (publish: true in configs/polymarket.yaml).")}</p>
    <input id="gid" placeholder="gist id, e.g. 4f00ab12…" autocomplete="off" spellcheck="false">
    <button class="btn" id="connect">Connect</button>
  </div>`;
  $("connect").addEventListener("click", () => {
    const v = $("gid").value.trim();
    if (v) { localStorage.setItem("wealth_gist", v); location.search = "?gist=" + v; }
  });
}

function renderError(msg) {
  $("app").innerHTML = `
  <div class="card center-card">
    <h2>Can't load the feed</h2>
    <p>${esc(msg)}</p>
    <button class="btn" id="retry">Retry</button>
  </div>`;
  $("retry").addEventListener("click", refresh);
}

/* ---------------------------------------------------------------- boot */
async function refresh() {
  const id = gistId();
  if (!id) { renderSetup(); return; }
  if (!state.snap) renderSkeleton();
  try {
    state.snap = await fetchSnapshot(id);
    render();
  } catch (e) {
    if (!state.snap) renderError(
      `Snapshot for gist "${id}" couldn't be loaded — check the id and that the bot is publishing. (${e.message})`);
  }
}
refresh();
setInterval(refresh, 60_000);
</script>
</body>
</html>
