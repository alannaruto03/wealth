[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wealth"
version = "0.1.0"
description = "Paper-first, self-tuning automated trading bot built on an honest backtesting engine"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "yfinance>=0.2.40",
    "ccxt>=4.2",
    "matplotlib>=3.7",
    "PyYAML>=6.0",
    "pyarrow>=14.0",
    "httpx>=0.27",
    "websockets>=12.0",
]

[project.optional-dependencies]
stocks = ["alpaca-py>=0.20"]
polymarket-live = ["py-clob-client-v2>=0.1"]
dashboard = ["streamlit>=1.36", "plotly>=5.22"]
dev = ["pytest>=8.0"]

[project.scripts]
wealth = "wealth.cli:main"

[tool.setuptools.packages.find]
include = ["wealth*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
